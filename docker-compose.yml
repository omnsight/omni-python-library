services:
  arangodb:
    image: arangodb/arangodb:3.12
    command: arangod --experimental-vector-index
    environment:
      - ARANGO_ROOT_PASSWORD=password
    ports:
      - "8529:8529"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  localai:
    image: localai/localai:latest
    ports:
      - "8080:8080"
    environment:
      PRELOAD_MODELS: '[{"url": "github:mudler/LocalAI/models/embeddings/bert-embeddings.yaml", "name": "all-minilm"}]'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
