[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-python-library"
version = "0.2.1"
description = "Omni Python Library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "python-arango>=7.5.0",
    "redis>=4.5.0",
    "cachetools>=5.3.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.11.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "types-redis",
    "types-cachetools",
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "pytest-asyncio",
    "poethepoet>=0.27.0",
]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["omni_python_library"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/omni_python_library"]

[tool.pytest.ini_options]
addopts = "--cov=src/omni_python_library --cov-branch --cov-report=xml"

[tool.poe.tasks]
clean = "scripts/cleanup.sh"
